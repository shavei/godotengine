name: Playtest builds

# Exports release builds for Windows and Linux (docs/PLAYTEST.md).
# Run it by hand (Actions > Playtest builds > Run workflow) to get the zips as
# workflow artifacts. Pushing a tag like v0.5.0 also attaches them to a GitHub release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    name: Export Windows and Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-win-linux

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          TEMPLATES=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATES"
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          # Only the two release templates the presets use (the full set is over 1 GB).
          unzip -j -o templates.tpz templates/version.txt templates/linux_release.x86_64 templates/windows_release_x86_64.exe -d "$TEMPLATES"
          rm templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --import

      - name: Export
        run: |
          mkdir -p builds/windows builds/linux
          ~/godot/godot --headless --export-release "Windows Desktop" builds/windows/PassItOn.exe
          ~/godot/godot --headless --export-release "Linux" builds/linux/PassItOn.x86_64
          test -f builds/windows/PassItOn.exe
          test -f builds/linux/PassItOn.x86_64
          chmod +x builds/linux/PassItOn.x86_64

      - name: Boot the Linux build
        run: |
          builds/linux/PassItOn.x86_64 --headless --quit-after 180 2>&1 | tee boot.log
          if grep -qE "SCRIPT ERROR|^ERROR" boot.log; then exit 1; fi

      - name: Zip
        run: |
          VERSION=$(grep -oP '^config/version="\K[^"]+' project.godot)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for platform in windows linux; do
            cp docs/PLAYTEST.md builds/$platform/README.md
            (cd builds/$platform && zip -q -r ../../PassItOn-$VERSION-$platform.zip .)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: PassItOn-${{ env.VERSION }}-windows
          path: PassItOn-${{ env.VERSION }}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PassItOn-${{ env.VERSION }}-linux
          path: PassItOn-${{ env.VERSION }}-linux.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PassItOn-*.zip --title "Playtest $GITHUB_REF_NAME" \
            --notes "Playtest build. Unzip and read README.md first." --prerelease
